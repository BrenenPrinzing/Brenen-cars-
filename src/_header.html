<header class="pill">
  <a class="pill-id" href="index.html#top">
    <img class="avatar" src="{{avatar}}" alt="" width="36" height="36">
    <span>{{first_name}}</span>
  </a>
  <div class="pill-actions">
    {{follow}}
    <details class="sheet">
      <summary class="btn btn-ghost btn-sm">Menu</summary>
      <nav class="sheet-panel" aria-label="Sections">
        <ul class="sheet-links">{{menu}}</ul>
      </nav>
    </details>
  </div>
</header>
